<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts/scripts.js" defer></script>
</head>
<body>
    <div class="cadet">
        <div class="gray">
            <div class="tela">
                <span id="text"></span>
            </div>
            <div>
                 <button onclick="botao1()"> 1</button>
                 
                  <button onclick="botao2()"> 2</button>

                  <button onclick="botao3()"> 3</button>

                  <button onclick="subtracao()"> -</button>
            </div>
            <div class="flex">
                 <button onclick="botao4()"> 4</button>

                  <button onclick="botao5()"> 5</button>

                  <button onclick="botao6()"> 6</button>

                  <button onclick="multiplicacao()"> x</button>
            </div>
            <div class="flex">
                 <button onclick="botao7()"> 7</button>

                  <button onclick="botao8()"> 8</button>

                  <button onclick="botao9()"> 9</button>

                  <button onclick="soma()"> +</button>
            </div>
            <div class="flex">
                <button onclick="botao0()"> 0</button>
                
                <button onclick="divisao()"> %</button>
                
                <button onclick="resultado()"> =</button>
            </div>
            
            </div>
        </div>
    </div>
</body>
</html>
